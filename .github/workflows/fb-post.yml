name: Facebook Page post
run-name: ${{ github.event_name == 'schedule' && 'Facebook watch' || inputs.dry_run && 'Facebook dry run' || inputs.count != '' && 'Facebook manual post' || 'Facebook chain' }}

# Shares title pages on the Manhwa Index Facebook Page: a picture with a caption,
# then the link as the first comment (docs/facebook-posting.md).
#
# THE CHAIN. One run posts, waits and posts again for two hours
# (scripts/social/chain.mjs), then starts its successor with
# `gh workflow run` and ends. GitHub's hourly schedule proved unreliable on
# 12 Oct 2026 (no scheduled run for over three hours), so posting no longer
# depends on it.
#
#   Run workflow, nothing filled in    starts the chain (posts for real)
#   count = 2                          two posts now, then it ends; no chain
#   dry_run = true                     shows what it would post; never a chain
#   the cron, every 30 minutes         the backstop: starts a chain only when
#                                      none is running or waiting
#
# No overlap: every chain run sits in the concurrency group `fb-chain`, so a
# second one waits for the first to end and at most one waits at a time. The
# five-minute gap is kept from the LEDGER's own timestamps, whatever started
# the run.
#
# The pace (scripts/social/pace.mjs): never closer than
# FB_MIN_GAP_MINUTES (5 at least), never more than FB_POSTS_PER_DAY in any 24
# hours (24 when unset, 288 at most), spread evenly. Facebook's limit signals
# are written to the ledger and can lower the cap (limits.mjs).
#
# Until the FB_PAGE_ID / FB_PAGE_TOKEN secrets exist it is a green dry run.
# With them, it posts only when the repo variable FB_POST_ENABLED is 'true'.
#
# Template posts (an image drawn on the runner, one design per post type) are
# OFF until the repo variable FB_POST_TYPES names them, one by one. A manual
# dry run can preview any type with the `types` input; its pictures are kept
# as the run's "fb-preview" artifact. That input never makes a real post.
#
# Data: the deploy's catalog from the Actions cache, restored at the start of
# each run. A chain run lasts two hours here, so the catalog is never much
# older than the deploy's own six-hour refresh.
#
# Instagram rides along (scripts/social/ig.mjs): after a Facebook post goes
# through, the same post goes to the site's Instagram account, with "link in
# bio" for the line about the first comment. OFF until the repo variable
# IG_POST_ENABLED is 'true' and the IG_USER_ID secret is set; its own cap
# (IG_POSTS_PER_DAY, 8 unless set). An Instagram failure never stops Facebook.
#
# The ledger that stops double posts lives on the orphan branch social-state
# (scripts/social/ledger.mjs). Pushes there start no workflow.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be posted (true / false)'
        type: boolean
        default: false
      count:
        description: 'How many posts (or dry-run samples). Empty = start the chain'
        required: false
        default: ''
      types:
        description: 'Dry run only: post types to preview, e.g. where,fact (empty = the FB_POST_TYPES variable)'
        required: false
        default: ''
      started_by:
        description: 'Set by the workflow itself (chain / watch). Leave as it is'
        required: false
        default: 'hand'

# contents: write is for the social-state ledger branch; actions: write starts the next run of the chain.
permissions:
  contents: write
  actions: write

jobs:
  # The backstop. It posts nothing: it starts a chain when none is running.
  watch:
    if: github.event_name == 'schedule' && vars.FB_POST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a chain when none is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --repo "$REPO" --workflow fb-post.yml --limit 40 --json status,displayTitle \
            --jq '[.[] | select(.displayTitle == "Facebook chain" and .status != "completed")] | length')
          if [ "$active" != "0" ]; then
            echo "A chain is running or waiting ($active). Nothing to do."
            exit 0
          fi
          halted=$(gh api "repos/$REPO/contents/ledger.json?ref=social-state" -H 'Accept: application/vnd.github.raw' 2>/dev/null | jq -r '.health.halted.why // empty' 2>/dev/null || true)
          if [ -n "$halted" ]; then
            echo "::warning::The chain was halted: $halted. Fix it, then start the workflow by hand."
            exit 0
          fi
          echo "No chain is running. Starting one."
          gh workflow run fb-post.yml --repo "$REPO" -f started_by=watch

  post:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Under GitHub's six-hour limit for one job.
    timeout-minutes: 355
    # A chain run waits for the chain before it; a dry or counted run stands alone.
    concurrency:
      group: ${{ (inputs.dry_run || inputs.count != '') && format('fb-once-{0}', github.run_id) || 'fb-chain' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The deploy's catalog, read only. The path list must stay exactly the
      # deploy's: the cache version is computed from it, and a different list
      # silently finds nothing. Never saved from here.
      - name: Restore the catalog
        uses: actions/cache/restore@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}
          restore-keys: anilist-data-

      # The renderer's packages (satori, sharp, the fonts): only when a run draws.
      - name: Install the packages the template images need
        if: vars.FB_POST_TYPES != '' || inputs.types != '' || vars.IG_POST_ENABLED == 'true'
        run: npm ci --no-audit --no-fund

      # A reel is put together with ffmpeg. The runner image does not carry it (checked 12 Oct 2026),
      # so it is installed, and only for a run that can make a reel.
      - name: Cache ffmpeg
        if: contains(vars.FB_POST_TYPES, 'reel') || contains(inputs.types, 'reel')
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-bin
          key: ffmpeg-static-n8.1

      - name: Install ffmpeg for reels
        if: contains(vars.FB_POST_TYPES, 'reel') || contains(inputs.types, 'reel')
        working-directory: .
        timeout-minutes: 5
        run: |
          # A static build, kept in the Actions cache. apt-get hung for 13+ minutes on
          # 28 Oct 2026, and the cache makes later runs skip the download entirely.
          if [ ! -x "$HOME/ffmpeg-bin/ffmpeg" ]; then
            mkdir -p "$HOME/ffmpeg-bin"
            curl -fsSL --retry 3 --max-time 180 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz"               | tar -xJ --strip-components=2 -C "$HOME/ffmpeg-bin" --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg-bin/ffmpeg" -version | head -n 1

      - name: Post
        id: post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_POST_ENABLED: ${{ vars.FB_POST_ENABLED }}
          # The cap for any 24 hours (unset = 24, at most 288), and the least minutes between two posts (5 at least).
          FB_POSTS_PER_DAY: ${{ vars.FB_POSTS_PER_DAY }}
          FB_MIN_GAP_MINUTES: ${{ vars.FB_MIN_GAP_MINUTES }}
          # Reels in any 24 hours, inside the cap (unset = 3, at most 10). A reel type posts only when FB_POST_TYPES names it.
          FB_REELS_PER_DAY: ${{ vars.FB_REELS_PER_DAY }}
          # How long one run of the chain lasts before it hands over.
          FB_CHAIN_MINUTES: '120'
          # The template post types that are switched on (empty = classic posts only).
          FB_POST_TYPES: ${{ vars.FB_POST_TYPES }}
          # 'true' adds the Amazon line of the title to the first comment (off by default).
          FB_AFFILIATE_COMMENT: ${{ vars.FB_AFFILIATE_COMMENT }}
          # Instagram (scripts/social/ig.mjs): the same posts, after Facebook. OFF unless IG_POST_ENABLED is 'true'.
          IG_POST_ENABLED: ${{ vars.IG_POST_ENABLED }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Optional: the FB_PAGE_TOKEN is used when unset.
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # Posts in any 24 hours (unset = 8, at most 50), and the kinds that go (unset = every kind Facebook posts).
          IG_POSTS_PER_DAY: ${{ vars.IG_POSTS_PER_DAY }}
          IG_POST_TYPES: ${{ vars.IG_POST_TYPES }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          COUNT: ${{ inputs.count }}
          STARTED_BY: ${{ inputs.started_by }}
          # Read by a manual dry run only (post.mjs, settingsOf).
          TYPES: ${{ inputs.types }}
          FB_PREVIEW_DIR: ${{ runner.temp }}/fb-preview
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node --max-old-space-size=6000 scripts/social/post.mjs

      # Only a chain run that ended healthy writes chain=next (post.mjs).
      - name: Start the next run of the chain
        if: steps.post.outputs.chain == 'next'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fb-post.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f started_by=chain

      # The pictures and reels a dry run made, so a new design can be looked at.
      - name: Keep the preview pictures
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: fb-preview
          path: ${{ runner.temp }}/fb-preview
          if-no-files-found: ignore
          retention-days: 7
