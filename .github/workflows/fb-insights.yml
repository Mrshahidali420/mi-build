name: Facebook insights
run-name: Facebook insights (read only)

# Reads the Page's own numbers: views per post of the last 30 days, so we can see which kind of post earns views.
# Reads only. Posts nothing.
on:
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Views per post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          api="https://graph.facebook.com/v21.0"
          since=$(date -d '30 days ago' +%s)
          curl -sS "$api/$FB_PAGE_ID?fields=name,fan_count,followers_count&access_token=$FB_PAGE_TOKEN" | jq -c .
          echo "--- page views, daily, last 30 days"
          curl -sS "$api/$FB_PAGE_ID/insights?metric=page_media_view&period=day&since=$since&access_token=$FB_PAGE_TOKEN" | jq -c '.data[0].values | map(.value) // .' 2>&1 | head -c 1500; echo
          echo "--- posts: id, time, type, views"
          curl -sS "$api/$FB_PAGE_ID/published_posts?fields=id,created_time,status_type,message&limit=100&since=$since&access_token=$FB_PAGE_TOKEN" > posts.json
          jq -r '.data | length' posts.json
          for id in $(jq -r '.data[].id' posts.json | head -100); do
            v=$(curl -sS "$api/$id/insights?metric=post_media_view&access_token=$FB_PAGE_TOKEN" | jq -r '.data[0].values[0].value // "?"')
            jq -r --arg id "$id" --arg v "$v" '.data[] | select(.id==$id) | [.created_time[0:16], .status_type, $v, (.message // "" | gsub("\n";" ") | .[0:70])] | @tsv' posts.json
          done | sort
