name: Facebook insights
run-name: Facebook insights (read only)

# Reads the Page's own numbers: views per post of the last 30 days. Reads only. Posts nothing.
on:
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Views per post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          api="https://graph.facebook.com/v21.0"
          since=$(date -d '30 days ago' +%s)
          curl -sS "$api/$FB_PAGE_ID?fields=name,followers_count&access_token=$FB_PAGE_TOKEN" | jq -c .
          echo "--- page views by day (page_media_view)"
          curl -sS "$api/$FB_PAGE_ID/insights?metric=page_media_view&period=day&since=$since&access_token=$FB_PAGE_TOKEN" | jq -c 'if .data then (.data[0].values | map([.end_time[5:10], .value])) else .error.message end'
          curl -fsS "$api/$FB_PAGE_ID/published_posts?fields=id,created_time,status_type,message&limit=100&since=$since&access_token=$FB_PAGE_TOKEN" > posts.json
          echo "--- posts read: $(jq '.data|length' posts.json)"
          probe=$(jq -r '.data[0].id' posts.json)
          echo "probe: $(curl -sS "$api/$probe/insights?metric=post_media_view&access_token=$FB_PAGE_TOKEN" | head -c 250)"
          echo "--- views by post: time, type, views, text"
          for id in $(jq -r '.data[].id' posts.json); do
            v=$(curl -sS "$api/$id/insights?metric=post_media_view&access_token=$FB_PAGE_TOKEN" | jq -r '.data[0].values[0].value // "?"')
            jq -r --arg id "$id" --arg v "$v" '.data[] | select(.id==$id) | [.created_time[5:16], .status_type, $v, (.message // "" | .[0:60] | gsub("[\n]";" "))] | @tsv' posts.json
          done | sort > views.tsv
          sort -t$'\t' -k3 -nr views.tsv | head -25
          echo "--- total views by type"
          awk -F'\t' '$3!="?"{s[$2]+=$3;n[$2]++} END{for(k in s)print k, n[k], "posts", s[k], "views"}' views.tsv
          echo "--- reels (blue_reels_play_count) and videos (total_video_views)"
          curl -sS "$api/$FB_PAGE_ID/video_reels?fields=id,created_time,description&limit=100&access_token=$FB_PAGE_TOKEN" > reels.json
          echo "reels read: $(jq '.data|length' reels.json) $(jq -r '.error.message // empty' reels.json)"
          for id in $(jq -r '.data[]?.id' reels.json); do
            v=$(curl -sS "$api/$id/video_insights?metric=blue_reels_play_count&access_token=$FB_PAGE_TOKEN" | jq -r '.data[0].values[0].value // "?"')
            jq -r --arg id "$id" --arg v "$v" '.data[] | select(.id==$id) | [.created_time[5:16], "reel", $v, (.description // "" | .[0:60] | gsub("[\n]";" "))] | @tsv' reels.json
          done | sort -t$'\t' -k3 -nr | head -40
          echo "--- reel totals"
          for id in $(jq -r '.data[]?.id' reels.json); do curl -sS "$api/$id/video_insights?metric=blue_reels_play_count&access_token=$FB_PAGE_TOKEN" | jq -r '.data[0].values[0].value // 0'; done | awk '{s+=$1;n++} END{print n, "reels", s, "plays"}'
