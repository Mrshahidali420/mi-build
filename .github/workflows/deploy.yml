name: Build and deploy

on:
  push:
    branches: [master]
  schedule:
    # Every day at 02:00 UTC: pull fresh data, rebuild, redeploy.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      accept_registry:
        description: 'Adopt a rebuilt slug registry after the old one was lost (1 = yes). Read the error on the last run first.'
        required: false
        default: '0'

permissions:
  contents: read

# One group for every workflow that writes the catalog (this one, backfill.yml
# and backfill-fields.yml). Two of them running at once each restored the same
# cache entry, each wrote its own result back, and the one that saved last
# silently threw the other's work away.
concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Not `npm ci`: two copies of workerd live in the tree, and npm on
      # Windows cannot record the Linux binary of the second one in the
      # lock file. `npm install` resolves it on the runner instead.
      - run: npm install --no-audit --no-fund

      # The catalog is not in git. comics.json alone is 141 MB and GitHub
      # refuses any file over 100 MB, so the three big files live in the
      # GitHub Actions cache. The backfill workflow writes them; this job
      # reads them, tops them up, and writes them back. This daily run is
      # also what keeps the cache warm, because an unused cache is deleted
      # after 7 days.
      # The path list below must never change: actions/cache folds it into
      # the cache version, so a new path makes every older catalog entry
      # invisible and the build falls back to the seed. New state files get
      # their own cache entry instead, like the ones that follow.
      - name: Restore the catalog
        uses: actions/cache/restore@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}
          restore-keys: anilist-data-

      # A character we only know from a title's cast list has just a name and a
      # face. The character walk asks AniList for every character it has, once,
      # then only the new ids each night. A title fetch carries ten cast
      # members; the walk brings the rest. Its place lives in its own cache
      # entry, never in the catalog one (see above).
      - name: Restore the character walk position
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/characters-walk.json
          key: characters-walk-${{ github.run_id }}
          restore-keys: characters-walk-

      # Every light and web novel AniList has, once, then only the new ones
      # each night through the daily probes. Same arrangement as above.
      - name: Restore the novel walk position
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: data/novels-walk.json
          key: novels-walk-${{ github.run_id }}
          restore-keys: novels-walk-

      # The manifest of the last site that actually shipped, in its own cache
      # entry. The build compares itself against it and refuses to deploy a
      # site more than 2% smaller: that is what a lost catalog cache looks
      # like, and shipping it turns thousands of indexed pages into 404s. The
      # slug registry step below reads it too, so it is restored early.
      - name: Restore the live manifest
        uses: actions/cache/restore@v4
        with:
          path: data/live-manifest.json
          key: live-manifest-${{ github.run_id }}
          restore-keys: live-manifest-

      # The frozen address of every page (see src/lib/slug-registry.mjs).
      - name: Restore the slug registry
        uses: actions/cache/restore@v4
        with:
          path: data/slug-registry.json
          key: slug-registry-${{ github.run_id }}
          restore-keys: slug-registry-

      # Opening and ending songs, written weekly by sync-animethemes.yml. Read
      # only here. Missing is fine: the pages just show no song list.
      - name: Restore the song list
        uses: actions/cache/restore@v4
        with:
          path: data/themes.json
          key: animethemes-${{ github.run_id }}
          restore-keys: animethemes-

      # R2 is the second home of everything above. It only fills in what the
      # cache could not: a missing file, or a catalog with fewer records than
      # the snapshot. It never makes anything smaller. It runs after every
      # cache restore so "missing" means missing from both. R2 trouble is a
      # warning, never a failed deploy.
      - name: Fill gaps from the R2 snapshot
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs pull

      # A cache is deleted after 7 days without use, and a brand new fork has
      # no cache at all. data/seed holds a small gzipped copy of the catalog so
      # the site can always be rebuilt. It is a floor, not the live data: the
      # backfill and the daily ingest never write to it.
      - name: Fall back to the seed catalog
        run: bash scripts/unseed.sh

      # Before the ingest, so a first registry is built from the catalog the
      # live site was built from and freezes exactly today's addresses.
      - name: Check the slug registry
        env:
          ACCEPT_REGISTRY: ${{ github.event.inputs.accept_registry }}
        run: node --max-old-space-size=6000 scripts/slug-registry.mjs

      # The daily run only asks AniList what changed since yesterday and
      # fetches those records. A push deploy skips it and builds from the
      # catalog in the cache. The one-time full backfill is a separate
      # workflow (backfill.yml), because it takes hours.
      # If AniList has a bad day, we still build and deploy from the data
      # we already have. A stale site beats a dead site.
      - name: Pull changed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node --max-old-space-size=6000 scripts/ingest-daily.mjs

      # The walk keeps its place in data/characters-walk.json and never
      # removes a record.
      - name: Walk the AniList character list
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CHAR_MAX_CALLS: 1600
        run: node --max-old-space-size=6000 scripts/ingest-characters.mjs

      # Novels live in comics.json with kind 'novel'.
      - name: Walk the AniList novel list
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          NOVEL_MAX_CALLS: 1200
        run: node --max-old-space-size=6000 scripts/ingest-novels.mjs

      # This asks AniList for the bio and the other spellings, a slice at a
      # time, so the queue drains over a few days without slowing a deploy.
      - name: Fill in thin character pages
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/enrich-characters.mjs

      # Save BEFORE the build. The fresh records cost API calls, so a broken
      # build must not throw them away. `always()` keeps the save running even
      # when the ingest itself reported a problem.
      - name: Save the catalog
        id: save-catalog
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: |
            data/comics.json
            data/anime.json
            data/characters.json
          key: anilist-data-${{ github.run_id }}

      # The walk positions are saved only AFTER the catalog they describe. A
      # position saved without its records would skip those records for good:
      # the next run starts past them, but the catalog it restores never got
      # them.
      - name: Save the character walk position
        if: always() && steps.save-catalog.outcome == 'success' && hashFiles('data/characters-walk.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/characters-walk.json
          key: characters-walk-${{ github.run_id }}

      - name: Save the novel walk position
        if: always() && steps.save-catalog.outcome == 'success' && hashFiles('data/novels-walk.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/novels-walk.json
          key: novels-walk-${{ github.run_id }}

      # Episode air dates for the anime title pages, from the sister ingest's
      # bucket (sister-data/latest/airing.json). Read only, never written. If
      # it cannot be read, the script says why and the build goes on without
      # the episode lists; it never fails a deploy.
      - name: Read episode air dates
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node scripts/pull-airing.mjs

      # Which WhereAnime pages are live (sister-data/anime/where-links.json,
      # written by WhereAnime after each deploy), so anime and character pages
      # link only to pages that exist. Read only; never fails a deploy.
      - name: Read WhereAnime's live pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node scripts/pull-where-links.mjs

      # The homepage's self-updating shelves (scripts/plan-home.mjs). Last
      # night's plan comes back from its own cache entry; with no cache the
      # committed seed in data/ is used. The path list must never change, for
      # the same reason as the catalog's above.
      - name: Restore the homepage plan
        uses: actions/cache/restore@v4
        with:
          path: |
            data/home-auto.json
            data/home-decisions.json
          key: home-plan-${{ github.run_id }}
          restore-keys: home-plan-

      # Nightly only: a push deploy builds from the restored plan. Reads D1
      # through the Cloudflare API, which needs Account > D1 > Read on the
      # token (CLOUDFLARE_D1_TOKEN wins when that secret exists). Any trouble
      # leaves the plan as it was, prints a warning and exits 0.
      - name: Plan the homepage from last night's numbers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
        run: node --max-old-space-size=6000 scripts/plan-home.mjs

      # The catalog grew to ~107,000 titles and each record now carries the
      # backfilled fields too. Both make-shards and astro build hold the whole
      # thing in memory, and the default 2 GB heap is no longer enough: the
      # first run after the backfill died with "heap out of memory".
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6000

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 735d0fbab0757142b2c29917563e0626

      # Straight after the deploy, before anything else can fail: the build
      # registered new and moved addresses, and they are live now. If this
      # waited behind the manifest steps and one of those failed, the cache
      # would keep yesterday's registry while today's addresses serve, and the
      # next night could hand a moved page a different address.
      # Never while the recovered marker exists: a stand-in must not replace
      # the real registry in the cache.
      - name: Save the slug registry
        if: always() && steps.deploy.outcome == 'success' && hashFiles('data/slug-registry.json') != '' && hashFiles('data/slug-registry.recovered') == ''
        uses: actions/cache/save@v4
        with:
          path: data/slug-registry.json
          key: slug-registry-${{ github.run_id }}

      # The plan that is now live, so tomorrow's night keeps each title's age,
      # cooldowns and the decisions log.
      - name: Save the homepage plan
        if: always() && steps.deploy.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/home-auto.json
            data/home-decisions.json
          key: home-plan-${{ github.run_id }}

      # Only after a successful deploy: the file must describe what is live.
      - name: Record the live manifest
        run: cp public/d/manifest.json data/live-manifest.json

      - name: Save the live manifest
        uses: actions/cache/save@v4
        with:
          path: data/live-manifest.json
          key: live-manifest-${{ github.run_id }}

      # Copy the catalog, the walk positions and the registry up to R2. Runs
      # even when the build failed, like the catalog save: the records cost
      # API calls. It refuses to replace the snapshot with a smaller catalog.
      - name: Save a snapshot to R2
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 735d0fbab0757142b2c29917563e0626
          REGISTRY_NOT_LIVE: ${{ steps.deploy.outcome != 'success' && '1' || '' }}
        run: node --max-old-space-size=6000 scripts/catalog-snapshot.mjs push

      # IndexNow tells Bing, Yandex, Seznam and Naver about new pages the same
      # day. Google ignores it and reads the sitemaps instead. This runs after
      # the deploy, never before: announcing a page that is not live yet is how
      # a site teaches a crawler to distrust it.
      #
      # The record of what has already been announced lives in its own cache
      # entry, separate from the catalog, because it is written after the
      # catalog has already been saved.
      - name: Restore the IndexNow record
        uses: actions/cache/restore@v4
        with:
          path: data/indexnow-sent.json
          key: indexnow-sent-${{ github.run_id }}
          restore-keys: indexnow-sent-

      # A search engine being unreachable must never fail a good deploy.
      - name: Announce new pages
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: Save the IndexNow record
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/indexnow-sent.json
          key: indexnow-sent-${{ github.run_id }}
